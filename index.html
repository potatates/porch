<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Porch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<style>
:root {
  --bg: #f6f6f2;
  --surface: #ffffff;
  --fg: #1d1f1b;
  --muted: #6d7268;
  --line: #e3e4dd;
  --accent: #4b6b4f;
  --a1: #c9d6c4; --a2: #e3d3bd; --a3: #c6d3e0; --a4: #e6cccc; --a5: #d6d0e6; --a6: #dbe0c0;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141613; --surface: #1c1f1b; --fg: #e8e9e3; --muted: #969b90; --line: #2c302a;
    --accent: #9cbf9f;
    --a1: #3a4a38; --a2: #4d4231; --a3: #33414f; --a4: #4f3737; --a5: #403a52; --a6: #454b30;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
.wrap { max-width: 580px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: flex; flex-direction: column; gap: 28px; }
.col { display: flex; flex-direction: column; gap: 28px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand b { font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
.people { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
nav { display: flex; gap: 4px; }
nav button { font: inherit; font-size: 14px; background: none; border: 0; color: var(--muted); padding: 6px 10px; border-radius: 999px; cursor: pointer; }
nav button[aria-selected="true"] { color: var(--fg); background: var(--line); }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--fg); flex: none; }
.av svg { width: 60%; height: 60%; }
.av.sm { width: 24px; height: 24px; }
.av.lg { width: 52px; height: 52px; }
.stack { display: inline-flex; }
.stack .av { border: 2px solid var(--bg); margin-left: -7px; }
.stack .av:first-child { margin-left: 0; }
.prompt .stack .av { border-color: var(--surface); }

.label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
.hint { font-size: 13px; color: var(--muted); }

/* prompt */
.prompt { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.prompt-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.prompt q { font-family: var(--serif); font-style: italic; font-size: 25px; line-height: 1.28; quotes: none; text-wrap: balance; overflow-wrap: anywhere; }
.src { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.answered-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.locked { display: flex; flex-direction: column; gap: 8px; }
.ghost { height: 12px; border-radius: 4px; background: var(--line); }
.timer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.timer { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
.timer.done { color: var(--accent); }
.tbar { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--accent); transition: width 1s linear; }

textarea, input[type="text"] { font: inherit; width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 10px; padding: 10px 12px; }
textarea { resize: vertical; min-height: 76px; }
textarea.write { min-height: 200px; font-family: var(--serif); font-size: 17px; line-height: 1.6; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.btn { font: inherit; font-size: 14px; font-weight: 500; border: 0; border-radius: 999px; padding: 8px 16px; background: var(--fg); color: var(--bg); cursor: pointer; }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn.quiet { background: none; color: var(--fg); border: 1px solid var(--line); }

/* answers */
.pieces { display: flex; flex-direction: column; gap: 22px; }
.piece { display: flex; flex-direction: column; gap: 8px; }
.piece-head { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.piece-head .name { font-weight: 500; }
.piece-head .words { color: var(--muted); }
.piece .text { font-family: var(--serif); font-size: 17px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.pieces .piece + .piece { border-top: 1px solid var(--line); padding-top: 22px; }

/* feed */
.composer { display: flex; flex-direction: column; gap: 10px; }
.feed { display: flex; flex-direction: column; }
.day { padding-block: 14px 6px; }
.post { display: flex; gap: 12px; padding-block: 14px; border-top: 1px solid var(--line); }
.day + .post { border-top: 0; }
.post-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.meta { display: flex; gap: 8px; font-size: 13px; }
.meta .name { font-weight: 500; }
.meta .time { color: var(--muted); }
.post p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.empty { padding-block: 20px; color: var(--muted); font-size: 14px; }

/* comments */
.ctoggle { align-self: flex-start; font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 2px 0; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.ctoggle:hover { color: var(--fg); }
.ctoggle .av { width: 20px; height: 20px; }
.thread { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }
.bubble { align-self: flex-start; max-width: 85%; display: flex; flex-direction: column; gap: 1px; }
.bubble .from { font-size: 11px; color: var(--muted); padding-left: 12px; }
.bubble .msg { background: var(--line); padding: 7px 12px; border-radius: 16px 16px 16px 4px; font-size: 14px; overflow-wrap: anywhere; }
.bubble.same .from { display: none; }
.bubble.mine { align-self: flex-end; }
.bubble.mine .from { display: none; }
.bubble.mine .msg { background: var(--accent); color: var(--bg); border-radius: 16px 16px 4px 16px; }
.reply { display: flex; align-items: center; gap: 6px; margin-top: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 3px 3px 14px; background: var(--bg); }
.prompt .reply { background: var(--surface); }
.reply:focus-within { border-color: var(--accent); }
.reply input[type="text"] { border: 0; background: none; padding: 5px 0; font-size: 14px; min-width: 0; outline: none; border-radius: 0; }
.reply button { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--fg); color: var(--bg); display: grid; place-items: center; cursor: pointer; }
.reply button svg { width: 14px; height: 14px; }

.end { text-align: center; padding-block: 36px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; border-top: 1px solid var(--line); }
.end strong { font-weight: 500; }
.end span { color: var(--muted); font-size: 13px; max-width: 34ch; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* prompts tab */
.bank { display: flex; flex-direction: column; gap: 14px; }
.queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.queue li { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding-block: 14px; border-top: 1px solid var(--line); }
.queue li:last-child { border-bottom: 1px solid var(--line); }
.qwhen { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.qbody { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.qtext { font-family: var(--serif); font-size: 18px; line-height: 1.35; overflow-wrap: anywhere; }
.fallback .qtext { color: var(--muted); font-style: italic; }
.link { font: inherit; background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; }
.add { display: flex; flex-direction: column; gap: 10px; }
.past { display: flex; flex-direction: column; }
.past details { border-top: 1px solid var(--line); padding-block: 16px; }
.past details:last-child { border-bottom: 1px solid var(--line); }
.past summary { cursor: pointer; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.past summary::-webkit-details-marker { display: none; }
.past summary .pq { font-family: var(--serif); font-style: italic; font-size: 20px; line-height: 1.3; overflow-wrap: anywhere; }
.past summary .label { text-transform: none; letter-spacing: 0; font-size: 13px; }
.past .pieces { padding-top: 20px; }
@media (max-width: 440px) { .queue li { grid-template-columns: 1fr; gap: 4px; } }

/* join */
.join { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.join h1 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 28px; line-height: 1.2; margin: 0; text-wrap: balance; }
.join p { margin: 0; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 8px; }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 10px; }
.pick { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 50%; justify-self: center; }
.pick .av { transition: transform .15s; }
.pick:hover .av { transform: scale(1.06); }
.pick[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--fg); }
.chosen { display: flex; align-items: center; gap: 12px; }

.notice { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 8px; }
.notice p { margin: 0; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; }
@media (prefers-reduced-motion: no-preference) { .fade { animation: fade .25s ease-out; } @keyframes fade { from { opacity: .4; transform: translateY(3px); } } }
</style>
</head>
<body>
<div class="wrap">
  <header id="header" hidden>
    <div class="brand"><b>Porch</b><span class="people" id="people"></span></div>
    <nav role="tablist">
      <button role="tab" aria-selected="true" data-view="home">Today</button>
      <button role="tab" aria-selected="false" data-view="prompts">Prompts</button>
    </nav>
  </header>
  <main id="view"><div class="hint">Loading…</div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
